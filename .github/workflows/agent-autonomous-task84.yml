name: Scheduled agent proof task 84 tests
on:
  push:
    branches:
      - agent-output/autonomous-task-84
    paths:
      - experiments/agent-proof/fixture/task84.mjs
      - .github/workflows/agent-autonomous-task84.yml
permissions:
  contents: read
jobs:
  generated-patch-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: node --test experiments/agent-proof/fixture/task84.test.mjs

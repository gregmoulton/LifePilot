name: Agent proof boundary tests
on:
  push:
    branches:
      - experiment/agent-unattended-proof-20261103
    paths:
      - .github/workflows/agent-proof-tests.yml
      - tools/agent-unattended-one-shot.mjs
      - tools/agent-unattended-one-shot.test.mjs
permissions:
  contents: read
jobs:
  boundary-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: node --test tools/agent-unattended-one-shot.test.mjs

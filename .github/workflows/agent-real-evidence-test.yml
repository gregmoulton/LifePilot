name: Life Pilot real-code agent gate — evidence validation
on:
  push:
    branches:
      - agent-output/real-evidence-blank-20261104
    paths:
      - execution.js
      - tests/agent-evidence-input.test.mjs
      - .github/workflows/agent-real-evidence-test.yml
permissions:
  contents: read
concurrency:
  group: lifepilot-real-agent-evidence-gate
  cancel-in-progress: false
jobs:
  real-code-regression:
    if: github.repository == 'gregmoulton/LifePilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: "Regression: real application evidence entry, fictional test data"
        run: node --test tests/agent-evidence-input.test.mjs

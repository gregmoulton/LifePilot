name: Autonomous coding runner — isolated proof (inactive)
# Intentionally no schedule, push or pull_request trigger.
# workflow_dispatch only becomes usable after separate owner-approved merge.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Must remain true for initial proof'
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: life-pilot-agent-poc
  cancel-in-progress: false
jobs:
  safe-proof:
    if: ${{ inputs.dry_run == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated coding loop (no AI, network writes, or profile access)
        run: node --test tools/runner-poc.test.mjs tools/runner-task-selector.test.mjs
      - name: Explain limitations
        run: echo 'Proof only; no model calls, no schedule, no repository write permissions, no PR creation.'

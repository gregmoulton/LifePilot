name: Life Pilot profile storage checks
on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - execution.js
      - storage.js
      - persistence.js
      - 'test/**'
      - .github/workflows/lifepilot-storage-tests.yml
permissions:
  contents: read
jobs:
  profile-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/*.test.cjs prime-workout/structure.test.mjs prime-workout/regression.test.mjs

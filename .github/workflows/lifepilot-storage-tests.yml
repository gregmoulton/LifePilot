name: Life Pilot profile storage checks
on:
  pull_request:
    branches: [main, 'fix/**', 'feature/**']
    paths:
      - index.html
      - execution.js
      - forward-radar.js
      - agenda-model.js
      - agenda.js
      - storage.js
      - persistence.js
      - 'test/**'
      - .github/workflows/lifepilot-storage-tests.yml
permissions:
  contents: read
jobs:
  profile-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: TZ=America/Phoenix node test/radar-original.cjs
      - run: node --test test/*.test.cjs prime-workout/structure.test.mjs prime-workout/regression.test.mjs
  browser-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python test/browser-validation.py

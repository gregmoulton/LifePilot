name: Prime Workout tests
on:
  push:
    branches: [prime-progress-mvp]
  pull_request:
    paths:
      - 'prime-workout/**'
      - '.github/workflows/prime-workout-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test prime-workout/structure.test.mjs prime-workout/regression.test.mjs

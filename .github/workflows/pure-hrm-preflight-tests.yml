name: The Pure HRM Preflight Verification
on:
  push:
    branches:
      - fix/pure-preflight-hrm-gate-20261103
  pull_request:
    paths:
      - 'prototypes/the-pure-hit-1-6-work-review/**'
      - '.github/workflows/pure-hrm-preflight-tests.yml'
permissions:
  contents: read
jobs:
  node-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Run Pure source regression tests
        working-directory: prototypes/the-pure-hit-1-6-work-review
        run: node --test tests/*.test.cjs

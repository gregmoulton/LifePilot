name: The Pure release checks

on:
  pull_request:
    paths:
      - 'the-pure/**'
      - 'recovery/the-pure-android-chatgpt-site/**'
      - '.github/workflows/the-pure-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: the-pure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: git rev-parse HEAD
      - run: node --test tests/*.test.cjs release/*.test.cjs
      - run: node release/pwa-preflight.cjs
      - run: npm install --prefix "$RUNNER_TEMP/pure-browser" --no-audit --no-fund --save-exact playwright@1.58.2
      - run: '"$RUNNER_TEMP/pure-browser/node_modules/.bin/playwright" install --with-deps chromium'
      - run: NODE_PATH="$RUNNER_TEMP/pure-browser/node_modules" node tests/browser/e2e.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/pure-browser/node_modules" node release/pwa-update.browser.cjs

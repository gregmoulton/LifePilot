<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life Pilot v0.4 · Your goals, your route</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17303b;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}header{background:#102d3c;color:#fff;padding:22px max(18px,calc((100vw - 1100px)/2));border-bottom:4px solid #d5aa60}header small{letter-spacing:2px;color:#e8c994;font-weight:700}header h1{margin:6px 0;font-size:30px}header p{margin:0;color:#c3d7df}main{max-width:1100px;margin:auto;padding:22px 16px 70px}button,.btn{cursor:pointer;background:#126e74;color:white;border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:650}button:hover{filter:brightness(1.08)}button.secondary{background:#e7eef1;color:#17303b}button.danger{background:#9d3842}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;border:1px solid #bdcdd2;border-radius:8px;padding:10px;font:inherit;background:white}textarea{min-height:75px}label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}.panel{background:#fff;border:1px solid #dae4e7;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 2px 8px #102d3c09}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:13px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:#647882}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#e7f1f0;color:#165b61;font-size:12px;font-weight:700}.warn{background:#fff4dd;color:#765719}.hidden{display:none!important}.goal h3{margin:0 0 6px}.goal p{margin:7px 0}.mini{font-size:13px}.line{border-top:1px solid #e2e9ec;margin:15px 0}nav{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}nav button{background:#e7eef1;color:#24434c}nav button.active{background:#126e74;color:white}.metric{font-size:27px;font-weight:800}.note{border-left:4px solid #d5aa60;padding:10px 12px;background:#fff9ed;border-radius:5px}ul{padding-left:20px}li{margin:5px 0}.small{font-size:12px}#toast{position:fixed;bottom:15px;right:15px;background:#143d40;color:white;border-radius:9px;padding:12px 18px;display:none;max-width:90vw}footer{font-size:12px;color:#637983;text-align:center;margin-top:25px}@media(max-width:600px){header h1{font-size:24px}.panel{padding:15px}}
</style></head><body><header><small>PERSONAL OPTIMIZATION SYSTEM</small><h1>✦ Life Pilot</h1><p>You choose the destination. Explore the route. Learn from results.</p></header><main><section id="storageWarning" class="panel warn" role="alert" hidden><p id="storageMessage"></p><div class="row"><button onclick="exportRecovery('stored')">Download stored data</button><button onclick="exportRecovery('backup')">Download previous backup</button><button onclick="exportRecovery('original')">Download pre-recovery data</button><button onclick="restoreLocalBackup()">Restore previous backup</button><label>Restore a backup file<input type="file" accept=".json,application/json" onchange="if(this.files[0])restoreLocalBackup(this.files[0])"></label><button id="unsavedExport" onclick="exportRecovery('unsaved')" hidden>Download unsaved changes</button><button onclick="location.reload()">Reload saved profile</button></div></section><div id="app"></div><footer>Life Pilot · Private test candidate · Connect shared sync once per device. Later sessions reconnect automatically. Review instructions before saving.</footer></main><div id="toast" role="status"></div><script>
'use strict';const KEY='lifepilot-v02-profile';const $=id=>document.getElementById(id);let profile=null,tab='dashboard';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.random().toString(36).slice(2,10);function notify(s){const e=$('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',3500)}function save(){localStorage.setItem(KEY,JSON.stringify(profile))}function button(t,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${t}</button>`}function fresh(){profile={schema_version:'0.2',product:'Life Pilot',profile_label:'My Life Pilot',goals:[],decision_register:[],created_at:new Date().toISOString(),optimization_policy:{strategy_bias:'none',major_decisions_require_user_approval:true}};save();render()}function welcome(){return `<div class="panel"><h2>Welcome to Life Pilot</h2><p>Start with a blank flight plan or bring your own existing goals. Each profile is independent.</p><div class="grid"><div class="panel"><h3>Start Fresh</h3><p class="muted">Create goals as Life Pilot gets to know your priorities.</p>${button('Start Fresh','fresh()')} ${button('Restore previous backup','restoreLocalBackup()','secondary')}</div><div class="panel"><h3>Import Existing Profile</h3><p class="muted">For returning users or Tester #1. Select a Life Pilot JSON file from your device.</p><input type="file" id="welcomeFile" accept=".json,application/json" onchange="importFile(this.files[0])"></div></div><p class="note mini">Start locally, then connect your shared agenda to use the same profile on your devices. Existing local data is not uploaded automatically.</p></div>`}function baseRender(){if(!profile){$('app').innerHTML=welcome();return}const n=profile.goals.length;const active=profile.goals.filter(g=>g.status!=='completed'&&g.status!=='paused').length;let html=`<div class="row between"><div><span class="tag">LOCAL PROFILE</span> <b>${esc(profile.profile_label||'My Life Pilot')}</b></div><div class="row">${button('Export Backup','exportProfile()','secondary')}${button('Switch / Reset','switchProfile()','secondary')}</div></div><nav>${[['dashboard','Overview'],['goals','Goal Stack'],['routes','Route Lab'],['decisions','Decisions'],['profile','Profile & Import']].map(([id,name])=>`<button class="${tab===id?'active':''}" onclick="showTab('${id}')">${name}</button>`).join('')}</nav>`;
if(tab==='dashboard')html+=`<div class="grid"><div class="panel"><div class="muted">Goals</div><div class="metric">${n}</div></div><div class="panel"><div class="muted">Active goals</div><div class="metric">${active}</div></div><div class="panel"><div class="muted">Recorded decisions</div><div class="metric">${(profile.decision_register||[]).length}</div></div></div><div class="panel"><h2>Today's navigation</h2>${n?`<p>Review the next actions for your active goals. Life Pilot will not automatically assume concurrent or sequential work is better.</p><ul>${profile.goals.filter(g=>g.status==='active').slice(0,6).map(g=>`<li><b>${esc(g.name)}</b>: ${esc((g.next_actions||[])[0]||'Choose a next action')}</li>`).join('')}</ul>${button('Compare approaches','showTab("routes")')}`:`<p>There are no goals yet. Start by adding a destination.</p>${button('Add your first goal','showTab("goals")')}`}</div><div class="panel"><h3>What this prototype can and cannot do</h3><p class="mini">It saves goals, tracks actions, imports/exports a profile, and presents transparent planning comparisons. It does <b>not</b> use a live AI model or know your current finances, schedule, or real-world progress. Any recommendation requires your review.</p></div>`;
if(tab==='goals')html+=`<div class="row between"><h2>Goal Stack</h2>${button('+ Add Goal','openGoalForm()')}</div><div id="goalForm"></div>${n?`<div class="grid">${profile.goals.map(g=>`<div class="panel goal"><div class="row between"><h3>${esc(g.name)}</h3><span class="tag">${esc(g.status||'active')}</span></div>${g.known_context?.length?`<p class="mini muted">${esc(g.known_context[0])}</p>`:''}<b class="mini">Next actions</b><ul class="mini">${(g.next_actions||[]).map(a=>`<li>${esc(a)}</li>`).join('')||'<li>Not yet specified</li>'}</ul><div class="row">${button('Edit',`openGoalForm('${esc(g.id)}')`,'secondary')}${button('Mark complete',`setStatus('${esc(g.id)}','completed')`,'secondary')}${button('Pause',`setStatus('${esc(g.id)}','paused')`,'secondary')}</div></div>`).join('')}</div>`:'<div class="panel">Your Goal Stack is empty. Add your first goal above.</div>'}`;
if(tab==='routes')html+=`<div class="panel"><h2>Route Lab v0.4 — multi-goal allocation</h2><p>Allocate a fixed number of hours across selected goals. Compare <b>sequential, concurrent, and hybrid</b> plans using the same stated assumptions. No strategy receives a built-in bonus.</p><div class="grid"><div><label>Available hours for this planning period</label><input id="hoursBudget" type="number" min="1" max="168" value="20"></div><div><label>Planning horizon</label><select id="horizon"><option value="week">One week</option><option value="month">One month</option></select></div></div><p class="mini muted">Select 2–5 goals. Set a priority weight and an estimated benefit per focused hour for each goal (relative planning units, not dollars). These are editable assumptions, not facts.</p><div id="routeGoals">${profile.goals.filter(g=>g.status!=='completed'&&g.status!=='paused').slice(0,12).map((g,i)=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #e3eaec"><label style="flex:3;min-width:210px;margin:0"><input type="checkbox" class="routePick" data-id="${esc(g.id)}" ${i<3?'checked':''} style="width:auto"> ${esc(g.name)}</label><label class="mini" style="flex:1;min-width:100px;margin:0">Priority (1–5)<input class="routeWeight" data-id="${esc(g.id)}" type="number" min="1" max="5" value="3"></label><label class="mini" style="flex:1;min-width:120px;margin:0">Benefit/hour (1–10)<input class="routeRate" data-id="${esc(g.id)}" type="number" min="1" max="10" value="5"></label></div>`).join('')}</div><p>${button('Calculate and compare plans','optimizeRoutes()')}</p><div id="routeResult" class="note">Enter assumptions and calculate. Results are estimates, not observed outcomes.</div></div>`;

if(tab==='decisions')html+=`<div class="panel"><h2>Decision register</h2><p class="mini muted">Major directions require your approval. Existing decisions are preserved when you import your profile.</p>${(profile.decision_register||[]).map(d=>`<div class="line"><b>${esc(d.id||'Decision')}</b> · <span class="tag">${esc(d.status||'proposed')}</span><p>${esc(d.decision)}</p></div>`).join('')||'<p>No decisions recorded yet.</p>'}<h3>Record a decision</h3><form onsubmit="addDecision(event)"><label>Decision or proposal</label><textarea id="decisionText" required placeholder="What are we deciding?"></textarea><label>Status</label><select id="decisionStatus"><option value="proposed">Proposed — needs review</option><option value="approved">Approved by owner</option></select><p><button type="submit">Save decision</button></p></form></div>`;
if(tab==='profile')html+=`<div class="panel"><h2>Profile & portability</h2><label>Profile label</label><input id="profileLabel" value="${esc(profile.profile_label||'My Life Pilot')}"><p>${button('Save Label','saveLabel()')} ${button('Export Profile','exportProfile()','secondary')}</p><div class="line"></div><h3>Import a profile</h3><p class="mini">Import replaces the current local profile. Export a backup first.</p><input type="file" accept=".json,application/json" onchange="importFile(this.files[0])"><div class="line"></div><p class="note mini">For privacy, never upload your personal profile JSON to a public GitHub repository. Browser storage can be cleared, so keep backups.</p></div>`;
$('app').innerHTML=html}function showTab(t){tab=t;render()}function setStatus(id,status){const g=profile.goals.find(x=>x.id===id);if(g){g.status=status;save();render();notify('Goal updated')}}function openGoalForm(id){const g=profile.goals.find(x=>x.id===id)||{};const el=$('goalForm');el.innerHTML=`<div class="panel"><h3>${g.id?'Edit':'Add'} goal</h3><form onsubmit="submitGoal(event,'${esc(g.id||'')}')"><label>Destination / goal</label><input id="goalName" required value="${esc(g.name||'')}"><label>What matters or what is known?</label><textarea id="goalContext">${esc((g.known_context||[]).join('\n'))}</textarea><label>Next actions (one per line)</label><textarea id="goalActions">${esc((g.next_actions||[]).join('\n'))}</textarea><label>Status</label><select id="goalStatus">${['active','paused','completed'].map(s=>`<option ${g.status===s?'selected':''}>${s}</option>`).join('')}</select><p class="row"><button type="submit">Save Goal</button>${button('Cancel','render()','secondary')}</p></form></div>`;el.scrollIntoView({behavior:'smooth',block:'nearest'})}function submitGoal(e,id){e.preventDefault();const g=profile.goals.find(x=>x.id===id)||{id:uid()};g.name=$('goalName').value.trim();g.known_context=$('goalContext').value.split('\n').map(x=>x.trim()).filter(Boolean);g.next_actions=$('goalActions').value.split('\n').map(x=>x.trim()).filter(Boolean);g.status=$('goalStatus').value;if(!id)profile.goals.push(g);save();render();notify('Goal saved')}function optimizeRoutes(){
 const budget=Number($('hoursBudget').value);const chosen=[...document.querySelectorAll('.routePick:checked')];const out=$('routeResult');
 if(!Number.isInteger(budget)||budget<1||budget>168){out.textContent='Choose a valid hours budget from 1 to 168.';return}
 if(chosen.length<2||chosen.length>5){out.textContent='Select between two and five goals to compare.';return}
 const goals=chosen.map(c=>{const id=c.dataset.id,g=profile.goals.find(x=>x.id===id);return {name:g.name,w:Number(document.querySelector('.routeWeight[data-id="'+CSS.escape(id)+'"]').value),r:Number(document.querySelector('.routeRate[data-id="'+CSS.escape(id)+'"]').value)}});
 if(goals.some(g=>!Number.isInteger(g.w)||g.w<1||g.w>5||!Number.isInteger(g.r)||g.r<1||g.r>10)){out.textContent='Priority must be 1–5 and benefit/hour must be 1–10.';return}
 // Diminishing returns: cumulative value = weight * rate * 6 * ln(1 + hours/6).
 // All three strategies are evaluated against the same curve; these parameters are illustrative.
 const val=(g,h)=>g.w*g.r*6*Math.log1p(h/6);
 const total=a=>a.reduce((sum,h,i)=>sum+val(goals[i],h),0);
 const n=goals.length,plans=[];
 const seq=Array(n).fill(0);seq[goals.reduce((best,g,i)=>g.w*g.r>goals[best].w*goals[best].r?i:best,0)]=budget;plans.push({name:'Sequential',a:seq});
 const concurrent=Array(n).fill(0);for(let t=0;t<budget;t++)concurrent[t%n]++;plans.push({name:'Concurrent (equal split)',a:concurrent});
 const hybrid=Array(n).fill(0);for(let t=0;t<budget;t++){let best=0, gain=-Infinity;goals.forEach((g,i)=>{const marginal=val(g,hybrid[i]+1)-val(g,hybrid[i]);if(marginal>gain){gain=marginal;best=i}});hybrid[best]++}plans.push({name:'Adaptive allocation',a:hybrid});
 plans.forEach(p=>p.score=total(p.a));const sorted=[...plans].sort((a,b)=>b.score-a.score);const winner=sorted[0];
 const table=plans.map(p=>`<tr><td><b>${esc(p.name)}</b>${p===winner?' ★':''}</td><td>${p.a.map((h,i)=>h?esc(goals[i].name)+': '+h+'h':'').filter(Boolean).join('<br>')}</td><td>${p.score.toFixed(1)}</td></tr>`).join('');
 out.innerHTML=`<b>Illustrative result:</b> ${esc(winner.name)} scores highest under the assumptions entered. <p><b>Budget:</b> ${budget} hours / ${esc($('horizon').value)} · <b>Selected goals:</b> ${n}</p><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;text-align:left" cellpadding="9"><thead><tr><th>Strategy</th><th>Hours by goal</th><th>Modeled benefit</th></tr></thead><tbody>${table}</tbody></table></div><p><b>Model:</b> each goal uses the same diminishing-returns curve: priority × benefit/hour × 6 × ln(1 + hours/6). Sequential puts all hours into the highest initial-value goal; concurrent divides hours equally; adaptive assigns each next hour to the highest marginal gain. All use identical time budgets.</p><p><b>What to test:</b> change priorities and benefit/hour assumptions; note when the winner changes. Then log actual hours and outcomes before trusting the model.</p><p class="mini muted"><b>Limitations:</b> User-entered benefit estimates, no calibrated outcome data, money constraints, deadlines, prerequisites, switching costs, or uncertainty intervals yet. Adaptive is mathematically advantaged within this simplified model because it maximizes the stated objective; that is not proof it works better in life. No live AI or cloud sync.</p>`;
}
function addDecision(e){e.preventDefault();profile.decision_register=profile.decision_register||[];profile.decision_register.push({id:'LP-'+String(profile.decision_register.length+1).padStart(3,'0'),decision:$('decisionText').value.trim(),status:$('decisionStatus').value,date:new Date().toISOString().slice(0,10)});save();render();notify('Decision recorded')}function saveLabel(){profile.profile_label=$('profileLabel').value.trim()||'My Life Pilot';save();render()}function exportProfile(){const blob=new Blob([JSON.stringify(profile,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='LifePilot_Profile_Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importFile(file){if(!file)return;try{const d=JSON.parse(await file.text());if(!Array.isArray(d.goals)||typeof d!=='object')throw Error('Missing goals array');if(profile&&!confirm('Replace the current local profile? Export a backup first if needed.'))return;profile={...d,product:'Life Pilot',goals:d.goals.map(g=>({...g,id:String(g.id||uid()),status:g.status||'active',known_context:Array.isArray(g.known_context)?g.known_context:[],next_actions:Array.isArray(g.next_actions)?g.next_actions:[]})),decision_register:Array.isArray(d.decision_register)?d.decision_register:[]};delete profile.import_status;save();tab='dashboard';render();notify('Profile imported successfully')}catch(e){alert('Could not import this file: '+e.message)}}function switchProfile(){if(!confirm('Export a backup before switching. Remove this profile from this browser and return to Start Fresh / Import?'))return;localStorage.removeItem(KEY);profile=null;tab='dashboard';render()}</script><script src="execution.js"></script><script src="storage.js"></script><script src="forward-radar.js"></script><script src="agenda-model.js"></script><script src="agenda.js"></script><script src="conversation.js"></script><script src="task-editor.js"></script><script src="persistence.js"></script>
<script src="shared-sync.js"></script>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Workout — local MVP</title><style>
:root{font:16px system-ui;color:#e9f0f4;background:#102331}body{max-width:650px;margin:auto;padding:18px}h1{margin-bottom:0}small{color:#afc5d1}section{background:#193546;padding:16px;margin:16px 0;border-radius:12px}label{display:block;margin:10px 0}input,select,textarea,button{font:inherit;padding:9px;border-radius:7px;box-sizing:border-box}input,select,textarea{background:#f9fcfd;color:#122330;width:100%}button{background:#287c83;color:white;border:0;margin:4px;cursor:pointer}.danger{background:#914b4b}li{margin:10px 0}nav{display:flex;gap:8px}nav button{flex:1}</style></head>
<body><h1>Prime Workout</h1><small>Private first-user prototype · data stays in this browser</small>
<section><h2>Log exercise</h2><form id="form"><label>Date <input id="date" type="date" required></label><label>Exercise <select id="exercise"><option>Pull-up</option><option>Ring dip</option><option>Inverted row</option><option>Push-up</option><option>Squat</option><option>Other</option></select></label><label>Variation / notes <input id="notes" maxlength="250" placeholder="Grip, assistance, technique"></label><label>Sets <input id="sets" type="number" min="1" max="100" value="3" required></label><label>Reps per set <input id="reps" type="number" min="0" max="1000" value="8" required></label><label>Effort (optional, 1–10) <input id="effort" type="number" min="1" max="10"></label><button type="submit">Save exercise</button><button type="button" id="cancel" hidden>Cancel edit</button></form></section>
<section><h2>Workout history</h2><p id="summary"></p><ul id="history"></ul><button id="export" type="button">Export JSON backup</button><label>Restore JSON backup <input id="import" type="file" accept="application/json,.json"></label></section>
<script>
'use strict';const KEY='prime-workout-mvp-v01';const $=id=>document.getElementById(id);let items=[];let editing=null;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))items=saved}catch(e){alert('Stored workout data could not be read. Export or inspect it before saving new records.')}
$('date').value=new Date().toLocaleDateString('en-CA');function persist(){localStorage.setItem(KEY,JSON.stringify(items));render()}
function render(){const ul=$('history');ul.replaceChildren();const days=new Set(items.map(x=>x.date));$('summary').textContent=items.length+' exercises logged across '+days.size+' workout days.';
for(const x of [...items].sort((a,b)=>b.date.localeCompare(a.date))){const li=document.createElement('li');const description=document.createElement('span');description.textContent=x.date+' — '+x.exercise+': '+x.sets+' × '+x.reps+(x.effort?' · effort '+x.effort:'')+(x.notes?' · '+x.notes:'');li.append(description);const edit=document.createElement('button');edit.textContent='Edit';edit.onclick=()=>{editing=x.id;for(const k of ['date','exercise','notes','sets','reps','effort'])$(k).value=x[k]??'';$('cancel').hidden=false;window.scrollTo(0,0)};const del=document.createElement('button');del.textContent='Delete';del.className='danger';del.onclick=()=>{if(confirm('Delete this exercise entry?')){items=items.filter(y=>y.id!==x.id);persist()}};li.append(edit,del);ul.append(li)}}
$('form').onsubmit=e=>{e.preventDefault();const data={date:$('date').value,exercise:$('exercise').value,notes:$('notes').value.trim(),sets:Number($('sets').value),reps:Number($('reps').value),effort:$('effort').value?Number($('effort').value):null};if(!data.date||!Number.isInteger(data.sets)||data.sets<1||!Number.isInteger(data.reps)||data.reps<0)return; if(editing){const i=items.findIndex(x=>x.id===editing);if(i<0)return;items[i]={...items[i],...data}}else items.push({id:crypto.randomUUID(),...data,recorded_at:new Date().toISOString(),source:'self-reported'});editing=null;$('cancel').hidden=true;$('notes').value='';$('effort').value='';persist()};
$('cancel').onclick=()=>{editing=null;$('cancel').hidden=true;$('form').reset();$('date').value=new Date().toLocaleDateString('en-CA')};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({schema:'prime-workout-v01',exported_at:new Date().toISOString(),exercises:items},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='prime-workout-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.schema!=='prime-workout-v01'||!Array.isArray(obj.exercises)||!obj.exercises.every(x=>typeof x.id==='string'&&typeof x.date==='string'&&typeof x.exercise==='string'&&Number.isInteger(x.sets)&&Number.isInteger(x.reps)))throw Error('Invalid backup format');if(confirm('Replace existing workout history with this backup?')){items=obj.exercises;persist()}}catch(err){alert('Could not import: '+err.message)}e.target.value=''};render();
</script></body></html>

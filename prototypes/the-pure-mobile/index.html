<!DOCTYPE html>
<html lang="en">
<head>

<title>The Pure | Strength. Simplified.</title>
<style>
:root{color-scheme:dark;--bg:#090e17;--panel:#141e2c;--panel2:#101824;--stroke:#26374c;--line:#27394e;--blue:#438efa;--blue2:#67b7ff;--light:#f3f7ff;--muted:#94a8c2;--green:#8de0ac;--amber:#ffcf81;--shadow:0 10px 35px rgba(0,0,0,.2)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100dvh;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(ellipse at 50% -10%,#18304c 0,#0b111c 40%,#090e17 75%);color:var(--light);-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,.exercise:focus-visible{outline:3px solid #7cbbff;outline-offset:2px}button:disabled{opacity:.44;cursor:not-allowed}.shell{max-width:446px;padding:14px 14px calc(22px + env(safe-area-inset-bottom));margin:0 auto}.top{display:flex;align-items:center;gap:12px;padding:4px 2px 16px}.logo{width:48px;height:48px;display:grid;place-items:center;background:linear-gradient(145deg,#192f4f,#101a2c);border:1px solid #365779;border-radius:15px;flex-shrink:0}.logo svg{width:32px;height:32px}.brand{flex:1}.brand strong{display:block;font-size:23px;letter-spacing:.14em;line-height:1.05;font-weight:850}.brand small{display:block;letter-spacing:.03em;color:var(--muted);font-size:11px;margin-top:5px}.small-tag{font-size:11px;background:#17283d;color:#a8d4ff;border:1px solid #2b4c72;padding:7px 9px;border-radius:99px;font-weight:750}.hero{border:1px solid var(--stroke);background:linear-gradient(155deg,#17263a,#111a29 72%);border-radius:20px;padding:17px 17px 16px;box-shadow:var(--shadow)}.hero-main{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:850}.hero-title{font-size:26px;font-weight:850;line-height:1.1;margin-top:5px}.hero-copy{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}.hrbox{text-align:right;padding-left:10px;border-left:1px solid var(--stroke);min-width:104px}.hrbox .heart{font-size:15px;color:#ff6985;margin-right:4px}.hrbox .hrval{font-size:17px;font-weight:800}.hrbox .hrsub{font-size:10px;color:var(--muted);line-height:1.35;margin-top:4px}.progress{display:flex;gap:6px;margin-top:15px}.progress span{height:5px;flex:1;background:#263647;border-radius:99px}.progress span.done{background:linear-gradient(90deg,#3975d9,#69bcff)}.sectionrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 2px 10px}.sectionrow h2{font-size:15px;letter-spacing:-.015em;margin:0}.hint{font-size:11px;color:var(--muted);text-align:right}.cards{display:grid;gap:9px}.exercise{touch-action:none;user-select:none;display:flex;align-items:center;gap:11px;padding:13px 13px 13px 11px;min-height:92px;border:1px solid var(--stroke);border-radius:16px;background:var(--panel);box-shadow:0 4px 16px rgba(0,0,0,.08);position:relative;transition:background .14s, border-color .14s;cursor:grab}.exercise.dragging{z-index:5;background:#233b58;border-color:#78baff;transform:scale(1.018);box-shadow:0 12px 32px rgba(0,0,0,.45);cursor:grabbing}.exercise.dropmark{border-top:3px solid #73b5ff}.idx{display:flex;flex-direction:column;align-items:center;justify-content:center;width:22px;gap:4px;color:#80a9d8;font-weight:800;font-size:14px;flex-shrink:0}.grip{font-size:16px;line-height:6px;letter-spacing:1px;color:#6986aa}.ex-main{min-width:0;flex:1}.ex-title{font-size:16px;font-weight:760;line-height:1.2}.ex-description{font-size:11px;color:var(--muted);margin-top:4px}.ex-standards{font-size:10px;color:#93b9e9;margin-top:6px;font-weight:650}.reps-wrap{text-align:center;flex-shrink:0}.reps{background:#0c1524;width:75px;height:59px;display:block;border-radius:13px;border:1px solid #334d6c;color:#fff;text-align:center;font-size:26px;line-height:1;font-weight:850;appearance:textfield;-moz-appearance:textfield;touch-action:manipulation;user-select:text;padding:5px}.reps::-webkit-outer-spin-button,.reps::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.reps:focus{background:#162a44;border-color:var(--blue)}.reps-label{display:block;margin-top:4px;font-size:9px;color:var(--muted);letter-spacing:.08em}.exercise.floor-hit{border-color:#375c68}.exercise.unlocked{border-color:#4a936e}.achievement{font-size:10px;color:var(--green);font-weight:800;margin-top:5px}.notice{border:1px solid #344e69;background:#101e2e;border-radius:13px;padding:12px 13px;margin-top:12px;color:#bed4ee;font-size:12px;line-height:1.5}.notice strong{color:#f4faff}.footer{margin-top:15px}.primary{width:100%;height:59px;background:linear-gradient(145deg,#4191fc,#2773d9);color:white;font-size:16px;font-weight:850;letter-spacing:.01em;border:1px solid #64a9fb;border-radius:16px;box-shadow:0 10px 22px rgba(38,115,217,.22)}.primary:active:not(:disabled){transform:translateY(1px)}.secondary{background:transparent;color:#a9c3df;border:1px solid #324a64;border-radius:13px;padding:11px 16px;font-size:13px;font-weight:700}.footer-links{display:flex;justify-content:center;gap:10px;margin-top:11px}.tertiary{background:none;border:0;color:#88a3c1;text-decoration:underline;text-underline-offset:3px;padding:8px;font-size:12px}.restbox{text-align:center;border:1px solid #344d69;background:linear-gradient(160deg,#172d48,#111c2e);padding:16px;border-radius:16px;margin-top:14px}.rest-chrono{font-size:36px;font-weight:850;letter-spacing:.03em;font-variant-numeric:tabular-nums;margin:2px 0}.rest-label{font-size:12px;color:#b2cbe9}.status{font-size:12px;color:#9eb5d0}.badge{display:inline-flex;gap:5px;align-items:center;border-radius:99px;padding:6px 10px;border:1px solid #3a5775;background:#1b2e45;color:#b6dcff;font-weight:720;font-size:11px}.center{text-align:center}.summarytop{text-align:center;padding:20px 0 4px}.award{font-size:38px}.summarytop h2{font-size:23px;margin:7px 0 4px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}.metric{border:1px solid var(--stroke);border-radius:14px;background:var(--panel);padding:14px 6px;text-align:center}.metric strong{display:block;font-size:24px;font-weight:850;font-variant-numeric:tabular-nums}.metric small{color:var(--muted);font-size:10px;display:block;margin-top:2px}.tablebox{margin-top:15px;border:1px solid var(--stroke);border-radius:15px;background:#111c2a;overflow:hidden}.tablebox h3{font-size:14px;margin:0;padding:14px 14px 9px}.result-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 14px;border-top:1px solid #25374b;align-items:center}.result-row strong{font-size:13px}.result-row small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.result-row b{font-size:18px}.muted{color:var(--muted)}.feedback{font-size:12px;min-height:16px;text-align:center;color:var(--amber);padding:7px 0}.subtle{font-size:11px;color:var(--muted);line-height:1.5;margin-top:10px}.kicker{display:inline-block;background:#192f4b;border:1px solid #395d81;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800;color:#a3d4ff}.welcome{padding-top:18px}.welcome h1{font-size:30px;line-height:1.07;letter-spacing:-.035em;margin:14px 0 9px}.welcome p{color:#b6c6d8;line-height:1.55;font-size:13px}.welcome .primary{margin-top:15px}.pulse{font-size:34px;color:#6db1ff}.hidden{display:none!important}@media(max-width:359px){.shell{padding:10px}.hero{padding:13px}.exercise{gap:7px;padding:10px}.reps{width:65px}.ex-title{font-size:14px}.brand strong{font-size:20px}}@media(min-height:790px){.shell{padding-top:22px}.exercise{min-height:100px}.hero{padding-top:19px;padding-bottom:19px}}
</style>
</head>
<body>
<main class="shell" id="app" aria-live="off"></main>
<script>
(()=>{'use strict';
const EX={push:{name:'Push-ups',variant:'Standard',floor:7,unlock:15},pull:{name:'Inverted rows',variant:'Bent-knee',floor:7,unlock:15},legs:{name:'Squats',variant:'Power',floor:19,unlock:30}};
const KEY='the_pure_mobile_proto_v1';
const clone=x=>JSON.parse(JSON.stringify(x));
const initial=()=>({v:1,phase:'welcome',order:['push','pull','legs'],round:1,counts:[{},{},{}],roundOrders:[null,null,null],roundEnds:[null,null,null],restEnds:[null,null,null],startedAt:null,endedAt:null,restStartedAt:null,pausedFrom:null,pausedAt:null,pausedMs:0,history:[]});
// Keep the last independently verified snapshot. Never report a save if storage rejected it.
let s=initial(),lastPersistedRaw=null,storageBlocked=false;
try{
  const raw=localStorage.getItem(KEY);
  if(raw!==null){
    const loaded=JSON.parse(raw);
    if(!loaded||loaded.v!==1||!Array.isArray(loaded.order)||loaded.order.length!==3||
       new Set(loaded.order).size!==3||!loaded.order.every(id=>EX[id])||
       !Array.isArray(loaded.counts)||!Array.isArray(loaded.history))throw Error('Invalid saved workout');
    s={...initial(),...loaded};lastPersistedRaw=raw;
  }
}catch(e){storageBlocked=true;}
const save=()=>{
  try{
    if(storageBlocked)throw Error('Existing workout data could not be read safely');
    const raw=JSON.stringify(s);
    localStorage.setItem(KEY,raw);
    if(localStorage.getItem(KEY)!==raw)throw Error('Stored workout did not verify on read-back');
    lastPersistedRaw=raw;
    return true;
  }catch(e){
    // Never leave a false completed/archived workout in memory after a failed write.
    if(lastPersistedRaw!==null){
      try{s={...initial(),...JSON.parse(lastPersistedRaw)}}catch(_e){storageBlocked=true}
    }else{s=initial()}
    alert('WORKOUT NOT SAVED. Your last verified workout state is retained. Storage error: '+(e&&e.message||'unknown')+'. Do not close this page until you have checked your saved data.');
    render();
    return false;
  }
};
const app=document.getElementById('app');
const pad=n=>String(n).padStart(2,'0');
const elapsed=(from,to=Date.now())=>{if(!from)return '00:00';let sec=Math.max(0,Math.floor((to-from)/1000));return `${pad(Math.floor(sec/60))}:${pad(sec%60)}`};
const total=(arr)=>Object.values(EX).reduce((n,_v,i)=>n,0); // no counting missing entries
const nfmt=x=>x===null||x===undefined?'—':String(x);
function logo(){return `<div class="logo" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M11 40V8h18c9 0 13 5 13 12s-5 12-13 12H20" fill="none" stroke="#f0f7ff" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/><path d="M11 40V8" stroke="#4b9dfa" stroke-width="7"/><path d="M20 28h9" stroke="#4b9dfa" stroke-width="6"/></svg></div>`}
function header(){return `<header class="top">${logo()}<div class="brand"><strong>THE PURE</strong><small>Strength. Simplified.</small></div><span class="small-tag">TEST 01</span></header>`}
function hero(){let name=s.phase==='welcome'?'Your strength.':s.phase==='complete'?'Session finished':s.phase==='paused'?'Workout paused':s.phase==='rest'?'Recovery time':`Round ${s.round} of 3`;
let descriptor=s.phase==='welcome'?'Three exercises. Three rounds.':s.phase==='rest'?'Enter reps while you recover.':s.phase==='active'?'Move through all three exercises.':s.phase==='complete'?'Your results, saved on this phone.':'Resume whenever you are ready.';
return `<section class="hero"><div class="hero-main"><div><div class="eyebrow">${s.phase==='welcome'?'The Pure · Mobile':s.phase==='complete'?'Completed session':'Active training'}</div><div class="hero-title">${name}</div><div class="hero-copy">${descriptor}</div></div><div class="hrbox"><div><span class="heart">♥</span><span class="hrval">— BPM</span></div><div class="hrsub">Heart-rate sensor<br>coming in V2</div></div></div><div class="progress">${[1,2,3].map(i=>`<span class="${s.phase==='complete'||s.round>=i?'done':''}"></span>`).join('')}</div></section>`}
function currentCounts(){return s.counts[s.round-1]}
function allFilled(){return s.order.every(id=>Number.isInteger(currentCounts()[id])&&currentCounts()[id]>=0)}
function cards(){return `<section aria-label="Exercise list"><div class="sectionrow"><h2>${s.phase==='welcome'?'Your workout':'Record your reps'}</h2><span class="hint">Hold and slide any row ↕</span></div><div id="cards" class="cards">${s.order.map((id,i)=>card(id,i)).join('')}</div><div class="feedback" id="feedback" role="status"></div></section>`}
function card(id,i){const ex=EX[id],val=currentCounts()[id],shown=val===undefined?'':String(val),hit=Number.isInteger(val)&&val>=ex.floor,unlock=Number.isInteger(val)&&val>=ex.unlock;
return `<div class="exercise ${unlock?'unlocked':hit?'floor-hit':''}" data-id="${id}" tabindex="0" role="group" aria-label="${ex.name}; hold to reorder; arrow keys to move"><div class="idx"><span class="order-num">${i+1}</span><span class="grip">⠿</span></div><div class="ex-main"><div class="ex-title">${ex.name}</div><div class="ex-description">${ex.variant}</div><div class="ex-standards">Floor ${ex.floor} · Unlock ${ex.unlock}</div>${unlock?'<div class="achievement">★ Unlock earned</div>':''}</div><div class="reps-wrap"><input class="reps" data-reps="${id}" aria-label="${ex.name} reps, round ${s.round}" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="9999" placeholder="—" value="${shown}" ${s.phase==='welcome'||s.phase==='paused'?'disabled':''}><span class="reps-label">REPS</span></div></div>`}
function welcome(){return `<section class="welcome"><span class="kicker">● BUILT FOR THE WORK, NOT THE MENUS</span><h1>Less tapping.<br>More training.</h1><p>Push. Pull. Squat. Move the entire exercise row to reorder it. When you've finished the circuit, tap <strong>Round Done · Rest</strong> and log reps while recovering.</p></section>${cards()}<div class="footer"><button class="primary" id="start">Start Workout →</button><div class="subtle center">The floors shown here are your initial 70% test values. This prototype does not connect to your heart-rate monitor yet.</div></div>`}
function running(){const isRest=s.phase==='rest',finalRound=s.round===3;return `${cards()}${isRest?`<section class="restbox"><div class="eyebrow">Round ${s.round} complete · Recovery</div><div class="rest-chrono" id="restTime">${elapsed(s.restStartedAt)}</div><div class="rest-label">Rest as long as you need. Enter or correct reps above.</div></section>`:`<div class="notice"><strong>No rest required between exercises.</strong> Finish all three, then start recovery immediately. You can record the reps while resting.</div>`}<div class="footer"><button class="primary" id="advance" ${isRest&&!allFilled()?'disabled':''}>${isRest?(finalRound?'Finish Workout ✓':`Start Round ${s.round+1} →`):'Round Done · Rest →'}</button>${isRest&&!allFilled()?'<div class="subtle center">Enter all three rep counts to continue. Missing is not recorded as zero.</div>':''}<div class="footer-links"><button class="secondary" id="pause">Pause Workout</button><button class="tertiary" id="earlyEnd">End Workout</button>${isRest?`<button class="tertiary" id="edit">Back to Round ${s.round}</button>`:''}</div></div>`}
function paused(){return `${cards()}<section class="restbox"><div class="pulse">Ⅱ</div><h2>Take the rest you need</h2><p class="status">Your rep counts are preserved. Pausing does not mark your round complete.</p></section><div class="footer"><button class="primary" id="resume">Resume Round ${s.round}</button><div class="footer-links"><button class="tertiary" id="earlyEnd">End Workout</button></div></div>`}
function summary(){let completed=s.roundEnds.filter(Boolean).length;let totalReps=Object.keys(EX).reduce((acc,id)=>acc+s.counts.reduce((v,round)=>v+(Number.isInteger(round[id])?round[id]:0),0),0);
let duration=elapsed(s.startedAt,s.endedAt||Date.now());let rows=s.order.map(id=>{let vals=s.counts.map(c=>c[id]).filter((v,i)=>i<=s.round-1&&(v!==undefined||s.roundEnds[i]));let repTotal=vals.reduce((a,v)=>a+(Number.isInteger(v)?v:0),0);const unlock=vals.some(v=>v>=EX[id].unlock);return `<div class="result-row"><div><strong>${EX[id].name}</strong><small>${vals.map(nfmt).join(' / ')}${unlock?' · ★ Unlock earned':''}</small></div><b>${repTotal}</b></div>`}).join('');
const unlocks=s.order.filter(id=>s.counts.some(c=>c[id]>=EX[id].unlock));
const rests=s.roundEnds.map((end,i)=>end&&s.restEnds[i]&&i<2?Math.round((s.restEnds[i]-end)/1000):null).filter(x=>x!==null);
return `<div class="summarytop"><div class="award">✦</div><h2>${s.endedEarly?'Workout Ended':'Workout Complete'}</h2><div class="muted" style="font-size:12px">${new Date(s.startedAt).toLocaleDateString(undefined,{month:'short',day:'numeric'})} · Strength. Simplified.</div></div><div class="metrics"><div class="metric"><strong>${completed}/3</strong><small>Rounds</small></div><div class="metric"><strong>${totalReps}</strong><small>Total reps</small></div><div class="metric"><strong>${duration}</strong><small>Duration</small></div></div><section class="tablebox"><h3>Exercise performance</h3>${rows}</section>${unlocks.length?`<div class="notice"><strong>★ Unlock: ${unlocks.map(id=>EX[id].name).join(', ')}.</strong><br>Finish the session; test the next harder variation fresh after enough recovery, before adopting a new Floor.</div>`:''}<section class="tablebox"><h3>Recovery and energy</h3><div class="result-row"><div><strong>Rest between rounds</strong><small>Measured from pressing Round Done until starting next round</small></div><b style="font-size:13px">${rests.length?rests.map(n=>`${n}s`).join(' · '):'—'}</b></div><div class="result-row"><div><strong>Heart-rate graph</strong><small>Requires real Bluetooth connection</small></div><b style="font-size:13px">Pending</b></div><div class="result-row"><div><strong>Calories burned</strong><small>Estimate requires weight and a validated method</small></div><b style="font-size:13px">Not estimated</b></div></section><div class="footer"><button class="primary" id="newWorkout">New Workout →</button><div class="footer-links"><button class="secondary" id="export">Export results</button></div></div><p class="subtle center">Stored locally on this device. No account or network required. Real Bluetooth, voice input, and scale sync are future versions.</p>`}
function render(){app.innerHTML=header()+hero()+(s.phase==='welcome'?welcome():s.phase==='active'||s.phase==='rest'?running():s.phase==='paused'?paused():summary());bind();tick()}
function tick(){const time=document.getElementById('restTime');if(time)time.textContent=elapsed(s.restStartedAt)}
setInterval(tick,1000);
function bind(){app.querySelector('#start')?.addEventListener('click',()=>{let history=s.history||[],order=[...s.order];s={...initial(),order,history,phase:'active',startedAt:Date.now()};save();render()});app.querySelectorAll('[data-reps]').forEach(input=>input.addEventListener('input',()=>{let raw=input.value.trim();let numeric=Number(raw);if(raw===''||!/^\d{1,4}$/.test(raw)||!Number.isInteger(numeric)){delete currentCounts()[input.dataset.reps]}else currentCounts()[input.dataset.reps]=numeric;const ex=EX[input.dataset.reps];const card=input.closest('.exercise');card.classList.toggle('unlocked',numeric>=ex.unlock&&raw!=='');card.classList.toggle('floor-hit',numeric>=ex.floor&&raw!=='');let note=card.querySelector('.achievement');if(numeric>=ex.unlock&&raw!==''){if(!note){note=document.createElement('div');note.className='achievement';card.querySelector('.ex-main').append(note)}note.textContent='★ Unlock earned'}else note?.remove();const advance=app.querySelector('#advance');if(advance&&s.phase==='rest')advance.disabled=!allFilled();save();}));
app.querySelector('#advance')?.addEventListener('click',()=>{const now=Date.now();if(s.phase==='active'){s.roundOrders[s.round-1]=[...s.order];s.roundEnds[s.round-1]=now;s.restStartedAt=now;s.phase='rest';save();render();return;}if(s.phase==='rest'){if(!allFilled()){document.querySelector('#feedback').textContent='Enter all three rep counts first.';return;}s.restEnds[s.round-1]=now;if(s.round===3){s.endedAt=now;s.phase='complete';s.history=[...(s.history||[]),{startedAt:s.startedAt,endedAt:s.endedAt,counts:clone(s.counts),orders:clone(s.roundOrders),roundEnds:clone(s.roundEnds),restEnds:clone(s.restEnds)}].slice(-20)}else{s.round++;s.phase='active';s.restStartedAt=null;}save();render()}});
app.querySelector('#pause')?.addEventListener('click',()=>{s.pausedFrom=s.phase;s.pausedAt=Date.now();s.phase='paused';save();render()});app.querySelector('#resume')?.addEventListener('click',()=>{if(s.pausedAt)s.pausedMs+=(Date.now()-s.pausedAt);s.pausedAt=null;s.phase=s.pausedFrom==='rest'?'rest':'active';s.pausedFrom=null;save();render()});app.querySelector('#earlyEnd')?.addEventListener('click',()=>{if(!confirm('End this workout? Your recorded reps and partial rounds will be saved.'))return;const now=Date.now();if(s.phase==='paused'&&s.pausedAt)s.pausedMs+=now-s.pausedAt;s.pausedAt=null;s.endedEarly=true;s.phase='complete';s.endedAt=now;s.history=[...(s.history||[]),{startedAt:s.startedAt,endedAt:now,endedEarly:true,counts:clone(s.counts),orders:clone(s.roundOrders),roundEnds:clone(s.roundEnds),restEnds:clone(s.restEnds)}].slice(-20);save();render()});app.querySelector('#edit')?.addEventListener('click',()=>{s.roundEnds[s.round-1]=null;s.restStartedAt=null;s.phase='active';save();render()});app.querySelector('#newWorkout')?.addEventListener('click',()=>{let history=s.history||[],order=[...s.order];s={...initial(),order,history};save();render()});app.querySelector('#export')?.addEventListener('click',()=>{const data={app:'The Pure mobile prototype v1',exportedAt:new Date().toISOString(),startedAt:new Date(s.startedAt).toISOString(),endedAt:s.endedAt?new Date(s.endedAt).toISOString():null,exerciseDefinitions:EX,exerciseOrder:[...s.order],reps:clone(s.counts),orderPerRound:clone(s.roundOrders),roundEnds:clone(s.roundEnds),restEnds:clone(s.restEnds),note:'Values are user-reported. No heart rate, calorie or scale readings were collected.'};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`the-pure-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)});installDrags();}
function installDrags(){let cardsBox=app.querySelector('#cards');if(!cardsBox)return;let active=null, timer=null, started=false,startY=0;
function reset(){if(timer){clearTimeout(timer);timer=null;}if(active){active.classList.remove('dragging');active.style.touchAction='';active=null;}started=false;}
function finalize(){if(!active)return;const list=[...cardsBox.querySelectorAll('.exercise')].map(el=>el.dataset.id);if(list.length===3&&new Set(list).size===3){s.order=list;cardsBox.querySelectorAll('.order-num').forEach((el,i)=>el.textContent=i+1);save();}reset()}
cardsBox.addEventListener('pointerdown',e=>{const target=e.target;if(e.button!==0||target.closest('input,button,a')||s.phase==='paused')return;let row=target.closest('.exercise');if(!row)return;active=row;started=false;startY=e.clientY;timer=setTimeout(()=>{if(!active)return;started=true;active.classList.add('dragging');try{active.setPointerCapture(e.pointerId)}catch(e){}if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}},240)});
cardsBox.addEventListener('pointermove',e=>{if(!active)return;if(!started){if(Math.abs(e.clientY-startY)>9)reset();return;}e.preventDefault();const other=[...cardsBox.querySelectorAll('.exercise')].find(el=>el!==active&&e.clientY>=el.getBoundingClientRect().top&&e.clientY<=el.getBoundingClientRect().bottom);if(!other)return;const midpoint=other.getBoundingClientRect().top+other.offsetHeight/2;cardsBox.insertBefore(active,e.clientY<midpoint?other:other.nextSibling)});
cardsBox.addEventListener('pointerup',()=>finalize());cardsBox.addEventListener('pointercancel',()=>finalize());window.addEventListener('pointerup',()=>{if(active)finalize()},{once:true});
cardsBox.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(!e.target.matches('.exercise')||!e.shiftKey||!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const id=e.target.dataset.id,idx=s.order.indexOf(id),other=idx+(e.key==='ArrowUp'?-1:1);if(other<0||other>=3)return;[s.order[idx],s.order[other]]=[s.order[other],s.order[idx]];save();render();app.querySelector(`.exercise[data-id="${id}"]`)?.focus()});
}
render();
})();
</script>
</body>
</html>

<style>
:root{color-scheme:dark;--bg:#080f1b;--card:#101e2e;--line:#263c55;--blue:#2c86f2;--blue2:#57afff;--text:#f5f9ff;--muted:#9db6cf;--good:#80e3ab;--red:#ff6578;--amber:#ffd38a}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% -10%,#152c45 0,#0a1423 32%,var(--bg) 73%);color:var(--text);font:15px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--blue2);outline-offset:3px}
.shell{max-width:475px;min-height:100dvh;margin:0 auto;padding:13px 14px calc(25px + env(safe-area-inset-bottom))}
.header{display:flex;align-items:center;gap:10px;margin:1px 3px 13px}.brandicon{width:53px;height:53px;border-radius:12px;object-fit:cover;flex-shrink:0}.brandstack{flex:1;min-width:0}.wordmark{width:161px;height:45px;object-fit:contain;object-position:left center;display:block;margin-bottom:-7px}.tagline{font-size:12px;color:#c1d3e9;letter-spacing:.025em;margin-top:4px}.gear{border:1px solid #294560;color:#a6c6e7;background:#12243a;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;font-size:21px}.gear svg{width:21px;height:21px}
.summaryline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 2px 9px}.roundtitle{font-size:27px;letter-spacing:-.045em;font-weight:850;line-height:1.15}.mini{color:var(--muted);font-size:11px}.over{font-size:10px;font-weight:800;letter-spacing:.13em;color:#78b9f8;text-transform:uppercase;margin-bottom:4px}
.hrwrap{text-align:right;min-width:119px}.bpm{display:flex;justify-content:flex-end;align-items:baseline;gap:5px;white-space:nowrap}.heart{color:var(--red);font-size:25px;vertical-align:middle;line-height:1}.bpm strong{font-size:28px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.bpm small{font-size:12px;color:#b6cbdf;font-weight:750}.fresh{color:#9ab3ca;font-size:10px}.fresh.on{color:var(--good)}
.progress{display:flex;gap:7px;margin:14px 1px 13px}.progress span{height:5px;flex:1;background:#294058;border-radius:999px}.progress span.on{background:#2687f2}
.connectbox{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid #23394f;border-radius:11px;background:#0e1c2c;padding:8px 10px;margin-bottom:12px;color:var(--muted);font-size:11px;min-height:40px}.connectbox strong{color:#c4daef;font-weight:650}.connectbtn{background:#183b5e;color:#d7ebff;font-weight:750;font-size:11px;border:1px solid #34678f;border-radius:8px;min-height:31px;padding:5px 9px;white-space:nowrap}
.listhead{display:flex;justify-content:space-between;align-items:baseline;margin:1px 2px 8px}.listhead strong{font-size:13px}.listhead span{color:#84a5c7;font-size:11px}
.exercise-list{display:grid;gap:9px}.exercise{display:flex;align-items:center;gap:9px;background:linear-gradient(145deg,#142337,#0f1b2a);border:1px solid #2b405a;border-radius:15px;padding:10px 11px 10px 8px;min-height:91px;position:relative;transition:transform .12s,border-color .12s}.exercise.hit{border-color:#3b625e}.exercise.unlocked{border-color:#438b6e}.exercise.dragging{z-index:3;opacity:.78;box-shadow:0 9px 22px #000b;background:#1b3553}.exercise.drop-before{box-shadow:0 -4px #388ff7}.exercise.drop-after{box-shadow:0 4px #388ff7}
.drag{border:0;background:transparent;color:#71a8d4;width:29px;align-self:stretch;min-height:52px;flex-shrink:0;touch-action:none;user-select:none;display:flex;align-items:center;justify-content:center;font-size:22px;padding:0;cursor:grab}.drag:active{cursor:grabbing;color:#e4f2ff}.drag:focus-visible{outline-offset:-2px}
.extext{flex:1;min-width:0}.exname{font-size:16px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.exgoal{font-size:11px;color:#a9c9eb;margin-top:5px}.exvariant{font-size:10px;color:#7896b4;margin-top:3px}.earned{font-size:10px;color:var(--good);font-weight:750;margin-top:3px}
.repcontrols{display:flex;gap:5px;align-items:center;flex-shrink:0}.roundbtn{width:33px;height:39px;border:1px solid #3b648a;border-radius:11px;background:#172f46;color:#f6fbff;font-size:25px;line-height:1;padding:0}.repinput{border:0;border-bottom:1px solid transparent;border-radius:0;padding:3px 0;background:transparent;color:var(--text);width:43px;height:42px;outline:0;text-align:center;font-size:24px;font-weight:800;appearance:textfield;-moz-appearance:textfield;font-variant-numeric:tabular-nums}.repinput:focus{border-color:var(--blue2);background:#182d42}.repinput::placeholder{color:#526f8a}.repinput::-webkit-inner-spin-button,.repinput::-webkit-outer-spin-button{display:none}
.mainbtn{width:100%;min-height:57px;padding:11px 12px;border:1px solid #56a5ff;border-radius:16px;background:linear-gradient(135deg,#338ff9,#2074df);color:white;font-size:15px;font-weight:800;box-shadow:0 10px 25px #123b6c44;margin-top:13px}.mainbtn:active:not(:disabled){transform:translateY(1px)}.mainbtn:disabled{background:#203951;border-color:#36506a;box-shadow:none;color:#9fb2c6}.underbtn{text-align:center;font-size:11px;color:#9fb3ca;margin:8px 3px 0}.notice{border:1px solid #2d4b6b;background:#11253a;border-radius:12px;color:#b9d5ed;font-size:11px;padding:9px 11px;margin-top:10px}
.toolrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:11px}.pill{border:1px solid #345270;color:#c0daee;background:#142a3f;border-radius:12px;padding:8px 11px;font-size:11px;font-weight:700;min-height:36px}.pill[aria-pressed="true"]{border-color:#4798fc;color:white}
.recovery{background:linear-gradient(160deg,#153452,#0d1f32);border:1px solid #365d84;border-radius:16px;text-align:center;padding:13px;margin-top:12px}.recovery.ready{background:#0c322d;border-color:#308163}.clock{font-size:36px;line-height:1.12;font-weight:900;font-variant-numeric:tabular-nums;margin:4px 0}.recovery.ready .clock{color:var(--good)}.recovery .line{font-size:12px;color:#b8d1eb}.recovery.ready .line{color:#bde5d0}
.status{font-size:11px;color:var(--amber);min-height:16px;margin:11px 1px 2px;text-align:center}.footer{font-size:10px;color:#6987a5;text-align:center;margin:12px auto 2px;line-height:1.45}.panel{border:1px solid #324c65;border-radius:15px;background:#0e1c2d;padding:15px;margin:12px 0}.panel h2{font-size:16px;margin:0 0 8px}.panel label{font-size:12px;color:#bacde1;display:block;margin:12px 0 5px}.panel input[type=number]{width:100%;height:42px;padding:9px;background:#0c1725;color:white;border:1px solid #34536f;border-radius:10px}.panel .toggle{display:flex;align-items:center;gap:9px;margin:10px 0;font-size:12px}.panel .toggle input{accent-color:#338ff9;width:17px;height:17px}.closebar{display:flex;justify-content:space-between;align-items:center;gap:8px}.closebar button{background:#19344c;border:1px solid #335670;border-radius:9px;color:#cce5fb;padding:8px 13px}.panelhint{color:#9cb5ce;font-size:11px;line-height:1.5}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}.metric{border:1px solid #2a4058;background:#102034;border-radius:14px;padding:14px 5px;text-align:center}.metric strong{display:block;font-size:23px;font-variant-numeric:tabular-nums}.metric small{font-size:10px;color:#a1b9d2}.results{margin-top:12px;background:#0e1b2c;border:1px solid #2b435e;border-radius:15px;overflow:hidden}.results h3{margin:0;padding:12px 13px 9px;font-size:14px}.resultrow{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #23384e;padding:11px 13px;gap:8px}.resultrow strong{font-size:13px}.resultrow small{display:block;color:#91abc4;font-size:11px;margin-top:4px}.resultrow b{font-size:19px}.newnotice{color:#9bb9d2;font-size:12px;margin:13px 3px}.graph{height:88px;width:100%;padding:3px 13px 8px}.graph svg{width:100%;height:100%}.graph .axis{stroke:#2c435c;stroke-width:1}.graph polyline{fill:none;stroke:#409aff;stroke-width:2}
@media(max-width:370px){.shell{padding-left:10px;padding-right:10px}.exname{font-size:14px}.repcontrols{gap:3px}.roundbtn{width:30px}.repinput{width:37px;font-size:22px}.exercise{gap:6px}.drag{width:25px}.tagline{font-size:11px}}
@media(max-height:745px){.header{margin-bottom:8px}.summaryline{margin:4px 2px 6px}.progress{margin:9px 1px}.exercise{min-height:79px;padding-top:7px;padding-bottom:7px}.exercise-list{gap:7px}.mainbtn{margin-top:9px;min-height:50px}.listhead{margin-bottom:6px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

/* V3.1: separate voice recording and destructive correction controls */
.voiceguide .voiceactions{display:grid;grid-template-columns:1fr;gap:12px;margin-top:11px}
.voiceguide .voiceactions button{margin:0;min-height:52px;width:100%;font-size:14px}
.voiceguide .voiceactions #voiceUndo{background:#283448;border:1px solid #60718a;color:#e5ecf5}
.exercise.voice-current{border:2px solid #62b6ff;box-shadow:0 0 0 2px #214365}.voiceguide{background:#132a42;border:1px solid #37638b;border-radius:12px;padding:12px;margin:9px 0;font-size:14px}.voiceguide strong{color:#d5ebff}.voiceguide button{margin-top:8px;background:#2467a3;border:0;color:white;border-radius:9px;padding:10px 14px;font-weight:700}

const STORE='the-pure-phone-approved-v2';
const fresh=()=>({version:2,phase:'ready',round:1,order:['push','legs','pull'],roundOrders:[null,null,null],counts:[{},{},{}],roundEnds:[null,null,null],restEnds:[null,null,null],recoveries:[null,null,null],startedAt:null,finishedAt:null,restStart:null,pausedAt:null,pausedTotal:0,samples:[],heartPeaks:[],threshold:110,voice:false,audio:true,weightKg:null,history:[]});

const app=document.getElementById('app');const now=()=>Date.now();const valid=n=>Number.isInteger(n)&&n>=0&&n<=999;const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(s))}catch(_e){}};
const esc=str=>String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ms=>{let t=Math.max(0,Math.floor(ms/1000));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const current=()=>s.counts[s.round-1],allFilled=()=>s.order.every(id=>valid(current()[id]));
const samples=()=>s.samples.filter(x=>Number.isFinite(x[1]));
const recentHR=()=>heart!==null&&now()-lastHeartAt<12000;
function brand(){return `<header class="header"><img class="brandicon" src="${ICON}" alt="The Pure mountain logo"><div class="brandstack"><img class="wordmark" src="${WORD}" alt="THE PURE"><div class="tagline">Strength. Simplified.</div></div><button class="gear" id="settingsButton" aria-label="Open settings" title="Settings">⚙</button></header>`}
function top(){let name=s.phase==='ready'?'Your workout':s.phase==='complete'?'Workout complete':s.phase==='rest'?`Round ${s.round} complete`:s.phase==='paused'?'Workout paused':`Round ${s.round} of 3`;
let small=s.phase==='ready'?'Three exercises. Three rounds.':s.phase==='rest'?'Rest & record reps':s.phase==='complete'?'Strength. Simplified.':s.phase==='paused'?'Rest as needed':'Move through all three exercises';
return `<div class="summaryline"><div><div class="over">${esc(small)}</div><div class="roundtitle">${name}</div></div><div class="hrwrap"><div class="bpm"><span class="heart">♥</span><strong id="hrValue">${recentHR()?heart:'—'}</strong><small>BPM</small></div><div id="hrFresh" class="fresh ${recentHR()?'on':''}">${recentHR()?'● Live heart rate':'Not connected'}</div></div></div><div class="progress">${[1,2,3].map(n=>`<span class="${s.phase==='complete'||s.round>=n?'on':''}"></span>`).join('')}</div>`}
function connectBox(){return `<div class="connectbox"><span><strong id="sensorLabel">${bleDevice?.gatt?.connected?'Heart monitor connected':'MOOFIT HW401'}</strong><br><span id="sensorDesc">${bleDevice?.gatt?.connected?'Live readings when available':'Optional Bluetooth heart rate'}</span></span><button id="connect" class="connectbtn">${bleDevice?.gatt?.connected?'Reconnect':'Connect HR'}</button></div>`}
function exCard(id){const x=EX[id],n=current()[id],has=valid(n),hit=has&&n>=x.floor,unlocked=has&&n>=x.unlock;return `<div class="exercise ${s.phase==='active'&&s.order[voiceStep]===id?'voice-current':''} ${unlocked?'unlocked':hit?'hit':''}" data-card="${id}" role="group" aria-label="${x.name} exercise row"><button class="drag" data-handle="${id}" aria-label="Drag ${x.name} to change order. Use arrow keys when focused." title="Hold and drag to reorder">⠿</button><div class="extext"><div class="exname">${x.name}</div><div class="exgoal">Floor ${x.floor} · Unlock ${x.unlock}</div><div class="exvariant">${x.variation}${unlocked?' · ★ Unlock earned':''}</div></div><div class="repcontrols"><button class="roundbtn" data-minus="${id}" aria-label="Subtract one ${x.name} rep">−</button><input class="repinput" type="number" inputmode="numeric" min="0" max="999" data-input="${id}" aria-label="${x.name} repetition count" placeholder="—" value="${has?n:''}" ${s.phase==='ready'||s.phase==='paused'?'disabled':''}><button class="roundbtn" data-plus="${id}" aria-label="Add one ${x.name} rep">+</button></div></div>`}

function toolRow(){return `<div class="toolrow"><button class="pill" id="mic" ${!s.voice?'disabled':''} aria-label="Speak repetition counts">${voiceListening?'🎙 Listening…':'🎙 Speak reps'}</button>${s.phase==='active'?'<button class="pill" id="pause">Pause</button>':''}<button class="pill" id="export">Export results</button></div>`}
function workout(){let intro=s.phase==='ready';return `${connectBox()}${s.phase==='active'?`<div class="voiceguide"><strong>Round ${s.round} · Exercise ${voiceStep+1} of 3: ${EX[s.order[voiceStep]].name}</strong><div>Finish the set, then tap Speak reps and say your total (for example, “twelve reps”).</div><div class="voiceactions"><button id="stepMic" type="button">🎙 Speak ${EX[s.order[voiceStep]].name} reps</button>${lastVoiceEntry?'<button id="voiceUndo" type="button">↶ Undo last voice entry</button>':''}</div></div>`:''}<div class="listhead"><strong>${intro?'Set your exercise order':'Record your reps'}</strong><span>⠿ Hold grip to reorder</span></div><div class="exercise-list" id="exerciseList">${s.order.map(exCard).join('')}</div>${s.phase==='rest'?restPane():''}<button class="mainbtn" id="action" ${s.phase==='rest'&&!allFilled()?'disabled':''}>${intro?'Start Workout →':s.phase==='rest'?(s.round===3?'Finish Workout ✓':`Start Round ${s.round+1} →`):s.round===3?'Finish Workout ✓':'Finish Round — Start Recovery →'}</button><div class="underbtn" id="underAction">${intro?'Reps stay empty until you record them.':s.phase==='rest'&&!allFilled()?'Enter all three counts to continue. Missing is not zero.':s.phase==='active'?'End round first, then enter counts while you rest.':s.phase==='rest'?'Ready whenever you are.':''}</div>${toolRow()}`}

let rows=s.order.map(id=>{const ns=s.counts.slice(0,rounds).map(c=>valid(c[id])?c[id]:null),n=ns.reduce((a,x)=>a+(x||0),0),un=ns.some(x=>x!==null&&x>=EX[id].unlock);return `<div class="resultrow"><div><strong>${EX[id].name}</strong><small>${ns.map(x=>x===null?'—':x).join(' / ')}${un?' · ★ Unlock':''}</small></div><b>${n}</b></div>`}).join('');
let calories='Not estimated';if(s.weightKg&&s.weightKg>=20&&s.weightKg<=350&&Number.isFinite(s.finishedAt-s.startedAt)){let min=Math.max(1,(s.finishedAt-s.startedAt-(s.pausedTotal||0))/60000);let lo=Math.round(3*3.5*s.weightKg*min/200),hi=Math.round(6*3.5*s.weightKg*min/200);calories=`~${lo}–${hi} kcal`}
const checkpoints=s.recoveries.slice(0,2).map(x=>x?fmt(x.ms):'—').join(' · ');
let graphic='';if(usable.length>=4){let down=usable.filter((_,i)=>i%Math.max(1,Math.floor(usable.length/130))===0);let low=Math.min(...down.map(x=>x[1]))-8, high=Math.max(...down.map(x=>x[1]))+8;let points=down.map((x,i)=>`${(i/Math.max(1,down.length-1)*310).toFixed(1)},${(76-(x[1]-low)/(high-low)*65).toFixed(1)}`).join(' ');graphic=`<div class="graph"><svg viewBox="0 0 310 84" role="img" aria-label="Heart rate sample trend"><line class="axis" x1="0" y1="77" x2="310" y2="77"/><polyline points="${points}"/></svg></div>`}
return `<div class="metrics"><div class="metric"><strong>${rounds}/3</strong><small>Rounds</small></div><div class="metric"><strong>${total}</strong><small>Clean reps*</small></div><div class="metric"><strong>${duration}</strong><small>Duration</small></div></div><div class="results"><h3>Exercise performance</h3>${rows}</div><div class="results"><h3>Heart rate & recovery</h3><div class="resultrow"><div><strong>Peak HR</strong><small>Highest captured BLE sample</small></div><b>${peak===null?'—':peak+' BPM'}</b></div><div class="resultrow"><div><strong>Average recorded HR</strong><small>Sample mean, not time-weighted</small></div><b>${avg===null?'—':avg+' BPM'}</b></div><div class="resultrow"><div><strong>Recovery checkpoints</strong><small>${s.threshold} BPM · between rounds</small></div><b style="font-size:14px">${checkpoints}</b></div><div class="resultrow"><div><strong>Rest interval times</strong><small>Between rounds</small></div><b style="font-size:14px">${rests}</b></div>${graphic?graphic:''}</div><div class="results"><h3>Estimated energy</h3><div class="resultrow"><div><strong>Calories</strong><small>${calories==='Not estimated'?'Enter optional weight in Settings to estimate':'Broad 3–6 MET range, not measured'}</small></div><b style="font-size:15px">${calories}</b></div></div><div class="notice">*Reps are self-reported. Unlock in any single set qualifies you to test the next harder exercise variation after recovery; do not advance mid-workout. This report is stored on your phone.</div><button class="mainbtn" id="newWorkout">Start New Workout →</button><div class="toolrow"><button class="pill" id="export">Export results</button></div>`}
function settings(){return `<section class="panel" aria-label="Workout settings"><div class="closebar"><h2>Workout settings</h2><button id="closeSettings">Done</button></div><label for="target">Recovery alert heart rate (BPM)</label><input id="target" type="number" inputmode="numeric" min="60" max="180" value="${s.threshold}"><label for="weight">Your weight in kg — optional for calorie estimate</label><input id="weight" type="number" inputmode="decimal" min="20" max="350" step="0.1" placeholder="Not entered" value="${s.weightKg||''}"><label class="toggle"><input id="audio" type="checkbox" ${s.audio?'checked':''}> Play a brief audible recovery alert</label><button class="pill" id="audioTest">Test audio</button><label class="toggle"><input id="voice" type="checkbox" ${s.voice?'checked':''}> Enable experimental push-to-talk rep entry</label><div class="panelhint">Voice and Bluetooth depend on browser and permissions. Phone file downloads may block Bluetooth; a future HTTPS-hosted version can support compatible Chrome Android devices. Data stays on this device unless you export it. Scale sync is planned, not yet active.</div></section>`}
function render(){app.innerHTML=brand()+top()+(s.phase==='complete'?report():s.phase==='paused'?paused():workout())+(settingsOpen?settings():'')+`<div id="status" role="status" aria-live="polite" class="status">${esc(statusMsg)}</div><div class="footer">THE PURE · Strength. Simplified. · V3.1 test · Final-round fix<br>Reps manually reported. Clean technique first. HR threshold is an optional cue, not an instruction to exercise before you're ready.</div>`;bind();tick();}
function message(txt){statusMsg=txt;let el=document.getElementById('status');if(el)el.textContent=txt;}
function audible(txt){if(!s.audio||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.rate=1.05;u.volume=.85;speechSynthesis.speak(u)}catch(_e){}}
function record(id,value){if(!valid(value))delete current()[id];else current()[id]=value;save();const el=document.querySelector(`[data-card="${id}"]`);if(el){let x=EX[id];el.classList.toggle('hit',valid(value)&&value>=x.floor&&value<x.unlock);el.classList.toggle('unlocked',valid(value)&&value>=x.unlock);const a=el.querySelector('.exvariant');if(a)a.textContent=x.variation+(valid(value)&&value>=x.unlock?' · ★ Unlock earned':'');}const btn=document.getElementById('action');if(btn&&s.phase==='rest')btn.disabled=!allFilled();const hint=document.getElementById('underAction');if(hint&&s.phase==='rest')hint.textContent=allFilled()?'Ready whenever you are.':'Enter all three counts to continue. Missing is not zero.';}
function completeWorkout(t){
 if(s.phase==='complete')return;
 s.roundEnds[2]=s.roundEnds[2]||t;
 s.roundOrders[2]=s.roundOrders[2]||[...s.order];
 // The final round is not followed by recovery; no artificial Round 3 rest interval.
 s.restEnds[2]=null;s.restStart=null;s.finishedAt=t;s.phase='complete';
 s.history=[...(s.history||[]),{startedAt:s.startedAt,finishedAt:t,counts:JSON.parse(JSON.stringify(s.counts)),roundOrders:JSON.parse(JSON.stringify(s.roundOrders)),recoveries:s.recoveries}].slice(-25);
 save();render();
}
function updateRound(){let t=now();if(s.phase==='ready'){let hist=s.history||[],order=[...s.order],threshold=s.threshold,voice=s.voice,audio=s.audio,weightKg=s.weightKg;s={...fresh(),order,threshold,voice,audio,weightKg,history:hist,phase:'active',startedAt:t};voiceStep=0;lastVoiceEntry=null;save();render();return;}
if(s.phase==='active'){if(s.round===3&&allFilled()){completeWorkout(t);return;}s.roundEnds[s.round-1]=t;s.restStart=t;s.phase='rest';s.roundOrders[s.round-1]=[...s.order];save();render();return;}
if(s.phase==='rest'){if(!allFilled()){message('Enter all three rep counts first.');return;}s.restEnds[s.round-1]=t;if(s.round===3){completeWorkout(t);return;}else{s.round++;s.phase='active';s.restStart=null;voiceStep=0;lastVoiceEntry=null;}save();render()}}
function exportResults(){let file={app:'The Pure — approved phone test V2',exportedAt:new Date().toISOString(),...s,notes:'All reps user reported, not independently counted. Heart rate optional BLE samples. No scale integration. Calories optional broad estimate.'};let blob=new Blob([JSON.stringify(file,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='the-pure-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1800);message('Workout data exported.')}
function parseVoice(t){let r={},words={push:'push',pushup:'push',pushups:'push',squat:'legs',squats:'legs',legs:'legs',leg:'legs',pull:'pull',pullup:'pull',pullups:'pull',row:'pull',rows:'pull',invertedrows:'pull'};let pat='push(?:[ -]?ups?)?|squats?|legs?|pull(?:[ -]?ups?)?|inverted[ -]?rows?|rows?';for(let m of t.toLowerCase().matchAll(new RegExp(`(${pat})\\s*(?:were|was|is|at|of)?\\s*(\\d{1,3})`,'g'))){let id=words[m[1].replace(/[ -]/g,'')];if(id)r[id]=Number(m[2])}for(let m of t.toLowerCase().matchAll(new RegExp(`(\\d{1,3})\\s*(${pat})`,'g'))){let id=words[m[2].replace(/[ -]/g,'')];if(id)r[id]=Number(m[1])}return r}
function spokenNumber(t){const clean=t.toLowerCase().replace(/[,.-]/g,' ').trim();let m=clean.match(/\b(\d{1,3})\b/);if(m)return Number(m[1]);const units={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19};const tens={twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};let words=clean.split(/\s+/);for(let i=0;i<words.length;i++){if(words[i] in tens)return tens[words[i]]+(units[words[i+1]]||0);if(words[i] in units)return units[words[i]];}return null;}
function listen(){const API=window.SpeechRecognition||window.webkitSpeechRecognition;if(!API){message('Speech recognition unavailable on this device. Enter reps manually.');return;}if(!s.voice||!['active','rest'].includes(s.phase))return;try{recognizer?.abort();const rec=new API();recognizer=rec;rec.lang='en-US';rec.interimResults=false;rec.continuous=false;rec.onstart=()=>{voiceListening=true;document.querySelectorAll('#mic,#stepMic').forEach(b=>b.textContent='🎙 Listening…');message(s.phase==='active'?'Say the completed count for '+EX[s.order[voiceStep]].name+'.':'Say an exercise and its count, e.g. “push-ups 12”.')};rec.onresult=e=>{const spoken=e.results[0][0].transcript;let id=null,n=null;if(s.phase==='active'){id=s.order[voiceStep];n=/\breps?\b/i.test(spoken)?spokenNumber(spoken):null;}else{const parsed=parseVoice(spoken);id=Object.keys(parsed)[0];if(id)n=parsed[id];}if(!id||!valid(n)){message('Heard “'+spoken+'” but could not identify a valid rep count. Nothing recorded.');return;}const previous=valid(current()[id])?current()[id]:null;const step=voiceStep;record(id,n);lastVoiceEntry={id,previous,step};if(s.phase==='active'){voiceStep=Math.min(2,voiceStep+1);if(step===2){updateRound();message(EX[id].name+': '+n+' recorded. '+(s.phase==='complete'?'Workout complete.':'Round complete. Check your entries and recover.'));audible(s.phase==='complete'?'Workout complete. Great work.':'Round complete. Recover at your own pace.');return;}}render();message(EX[id].name+': '+n+' reps recorded. '+(s.phase==='active'?'Next: '+EX[s.order[voiceStep]].name+'.':'Verify before continuing.'));audible(n+' recorded. '+(s.phase==='active'?'Next, '+EX[s.order[voiceStep]].name:'Review your results'));};rec.onerror=e=>message('Voice recognition: '+e.error+'. Manual entry remains available.');rec.onend=()=>{voiceListening=false;document.querySelectorAll('#mic,#stepMic').forEach(b=>b.textContent=b.id==='stepMic'?'🎙 Speak '+EX[s.order[voiceStep]].name+' reps':'🎙 Speak reps')};rec.start()}catch(_e){message('Microphone unavailable; enter reps manually.')}}
function hearRate(e){let v=e.target.value;let flags=v.getUint8(0);let n=(flags&1)?v.getUint16(1,true):v.getUint8(1);return Number.isInteger(n)&&n>=30&&n<=230?n:null}
async function connectHR(){if(!window.isSecureContext||!navigator.bluetooth){message('Bluetooth needs compatible Chrome and a secure HTTPS page. Manual reps and recovery timer work offline.');return;}try{message('Choose your MOOFIT heart-rate monitor from the Bluetooth picker.');if(bleDevice?.gatt?.connected){try{bleDevice.gatt.disconnect()}catch(_e){}}bleDevice=await navigator.bluetooth.requestDevice({filters:[{services:['heart_rate']}]});bleDevice.addEventListener('gattserverdisconnected',()=>{heart=null;lastHeartAt=0;message('Heart-rate monitor disconnected. Reconnect when ready.');tick()});const server=await bleDevice.gatt.connect();const svc=await server.getPrimaryService('heart_rate');bleCharacteristic=await svc.getCharacteristic('heart_rate_measurement');await bleCharacteristic.startNotifications();bleCharacteristic.addEventListener('characteristicvaluechanged',e=>{let n=hearRate(e);if(n===null)return;const t=now();heart=n;lastHeartAt=t;if(['active','rest'].includes(s.phase)){s.samples.push([t,n,s.phase,s.round]);if(s.samples.length>25000)s.samples=s.samples.slice(-20000);if(s.phase==='rest'&&s.round<3&&!s.recoveries[s.round-1]&&n<=s.threshold&&s.restStart){s.recoveries[s.round-1]={at:t,bpm:n,ms:t-s.restStart};message('Recovery target reached: '+n+' BPM. Start Round '+(s.round+1)+' whenever ready.');audible('Recovery target reached. Round '+(s.round+1)+' is ready whenever you are.');save();render();}if(s.samples.length%5===0)save();}tick()});message('Heart-rate monitor connected.');render();}catch(e){message('Bluetooth not connected: '+(e?.message||'selection cancelled')+'. Manual input is still available.')}}
function tick(){const hr=document.getElementById('hrValue'),fresh=document.getElementById('hrFresh');if(hr)hr.textContent=recentHR()?heart:'—';if(fresh){fresh.textContent=recentHR()?'● Live heart rate':bleDevice?.gatt?.connected?'Waiting for sensor':'Not connected';fresh.classList.toggle('on',recentHR())}let clock=document.getElementById('restTimer');if(clock&&s.phase==='rest'&&s.restStart)clock.textContent=fmt(now()-s.restStart)}
function initDnD(){let list=document.getElementById('exerciseList');if(!list)return;let drag=null;
for(const handle of list.querySelectorAll('[data-handle]')){handle.addEventListener('keydown',e=>{if(!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();let id=handle.dataset.handle,pos=s.order.indexOf(id),next=pos+(e.key==='ArrowUp'?-1:1);if(next<0||next>=3)return;[s.order[pos],s.order[next]]=[s.order[next],s.order[pos]];save();render();document.querySelector(`[data-handle="${id}"]`)?.focus();});handle.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();let row=handle.closest('[data-card]');drag={id:handle.dataset.handle,row,y:e.clientY,lastY:e.clientY,other:null};row.classList.add('dragging');handle.setPointerCapture(e.pointerId);});handle.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();drag.lastY=e.clientY;const siblings=[...list.querySelectorAll('[data-card]')];for(let x of siblings)x.classList.remove('drop-before','drop-after');let other=siblings.find(x=>x!==drag.row&&e.clientY>=x.getBoundingClientRect().top&&e.clientY<=x.getBoundingClientRect().bottom);if(other){drag.other=other;const pos=e.clientY<other.getBoundingClientRect().top+other.getBoundingClientRect().height/2?'before':'after';drag.place=pos;other.classList.add('drop-'+pos)}});function finish(){if(!drag)return;let original=drag.id;if(drag.other){const id=drag.other.dataset.card;const target=s.order.indexOf(id),old=s.order.indexOf(original);s.order.splice(old,1);let place=s.order.indexOf(id)+(drag.place==='after'?1:0);s.order.splice(place,0,original);save();}drag=null;render();document.querySelector(`[data-handle="${original}"]`)?.focus();}handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish);}}
function bind(){document.getElementById('settingsButton')?.addEventListener('click',()=>{settingsOpen=!settingsOpen;render()});document.getElementById('closeSettings')?.addEventListener('click',()=>{settingsOpen=false;render()});document.getElementById('connect')?.addEventListener('click',connectHR);document.getElementById('action')?.addEventListener('click',updateRound);document.getElementById('export')?.addEventListener('click',exportResults);document.getElementById('mic')?.addEventListener('click',listen);document.getElementById('stepMic')?.addEventListener('click',listen);document.getElementById('voiceUndo')?.addEventListener('click',()=>{if(!lastVoiceEntry)return;let x=lastVoiceEntry;lastVoiceEntry=null;voiceStep=x.step;record(x.id,x.previous);render();message('Voice entry undone. Try again.');});
for(let b of document.querySelectorAll('[data-plus],[data-minus]'))b.addEventListener('click',()=>{if(!['active','rest'].includes(s.phase))return;let id=b.dataset.plus||b.dataset.minus;let wasSet=valid(current()[id]);if(b.dataset.minus&&!wasSet)return;let n=wasSet?current()[id]:0;let add=b.dataset.plus?1:-1;record(id,Math.max(0,n+add));let input=document.querySelector(`[data-input="${id}"]`);if(input)input.value=current()[id]});
for(let input of document.querySelectorAll('[data-input]'))input.addEventListener('input',()=>{let raw=input.value.trim();record(input.dataset.input,/^\d{1,3}$/.test(raw)?Number(raw):null)});
initDnD();document.getElementById('pause')?.addEventListener('click',()=>{s.pausedAt=now();s.phase='paused';save();render()});document.getElementById('resume')?.addEventListener('click',()=>{if(s.pausedAt)s.pausedTotal+=now()-s.pausedAt;s.pausedAt=null;s.phase='active';save();render()});document.getElementById('endEarly')?.addEventListener('click',()=>{if(!confirm('End the workout early? Completed rounds will appear in the report.'))return;let t=now();s.pausedTotal+=s.pausedAt?t-s.pausedAt:0;s.pausedAt=null;s.finishedAt=t;s.phase='complete';save();render()});document.getElementById('newWorkout')?.addEventListener('click',()=>{if(!confirm('Start a new workout? Export this session first if you want an external backup.'))return;let config={order:[...s.order],threshold:s.threshold,voice:s.voice,audio:s.audio,weightKg:s.weightKg,history:s.history||[]};s={...fresh(),...config};save();settingsOpen=false;render()});
document.getElementById('audioTest')?.addEventListener('click',()=>{if(!('speechSynthesis'in window)){message('Text-to-speech is not supported in this browser.');return;}const test=new SpeechSynthesisUtterance('The Pure. Round two is ready.');test.rate=1.0;test.volume=.85;try{speechSynthesis.cancel();speechSynthesis.speak(test);message('Audio test requested; check phone volume.')}catch(e){message('Audio playback was blocked.')}});document.getElementById('target')?.addEventListener('change',e=>{let n=Number(e.target.value);if(Number.isInteger(n)&&n>=60&&n<=180){s.threshold=n;save()}else e.target.value=s.threshold});document.getElementById('weight')?.addEventListener('change',e=>{let n=Number(e.target.value);s.weightKg=Number.isFinite(n)&&n>=20&&n<=350?n:null;save();if(s.phase==='complete')render()});document.getElementById('audio')?.addEventListener('change',e=>{s.audio=e.target.checked;save()});document.getElementById('voice')?.addEventListener('change',e=>{s.voice=e.target.checked;save();let b=document.getElementById('mic');if(b)b.disabled=!s.voice});}
setInterval(tick,1000);render();
})();
</script></body></html>
